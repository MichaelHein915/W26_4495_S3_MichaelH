services:

  # ── ClickHouse — analytics warehouse ──────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse
    restart: unless-stopped
    env_file:
      - ../.env.cloud
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:8123:8123"    # HTTP — localhost for Grafana and FastAPI
      - "10.0.1.20:8123:8123"    # HTTP — private network for Spark (clickhouse-connect uses HTTP)
      # Port 8123 is NOT open on the public interface — Hetzner firewall blocks it.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── FastAPI — serves React SPA + /api/* endpoints ─────────────────────────
  api:
    build:
      context: ../../../
      dockerfile: infra/cloud/data-1/Dockerfile.api
    container_name: crypto-api
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - ../.env.cloud
    environment:
      APP_ENV: cloud
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      DASHBOARD_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"    # localhost only — Caddy proxies externally
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Grafana — analytics dashboard (zoomcamp 2-panel requirement) ───────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - ../.env.cloud
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"    # localhost only — Caddy proxies externally

  # ── Caddy — TLS termination + reverse proxy ────────────────────────────────
  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - api
      - grafana
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"    # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}

volumes:
  clickhouse_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/clickhouse-volume    # Hetzner attached volume
  grafana_data:
  caddy_data:
  caddy_config:
