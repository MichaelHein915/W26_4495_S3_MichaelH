# Prometheus configuration for crypto streaming pipeline
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "crypto-producer"
    static_configs:
      - targets: ["producer:9090"]
    metrics_path: "/"
    scrape_interval: 10s

  - job_name: "crypto-dashboard"
    static_configs:
      - targets: ["dashboard:5000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "crypto-consumer"
    static_configs:
      - targets: ["consumer:9091"]
    metrics_path: "/"
    scrape_interval: 10s
