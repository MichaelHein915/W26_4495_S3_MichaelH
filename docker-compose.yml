services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - crypto-network
    healthcheck:
      test: echo stat | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dual listeners: INTERNAL for containers, EXTERNAL for host
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
    networks:
      - crypto-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 45s

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: crypto-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RAW: crypto.trades.raw
      EXCHANGES: coinbase,binance,kraken
    networks:
      - crypto-network
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: crypto-consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RAW: crypto.trades.raw
      CHECKPOINT_DIR: /app/data/checkpoints/raw_console
    volumes:
      - spark-checkpoints:/app/data/checkpoints
    networks:
      - crypto-network
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: crypto-dashboard
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RAW: crypto.trades.raw
      DASHBOARD_PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - crypto-network
    restart: unless-stopped

  # Optional: S3/Athena sink — requires S3_BUCKET and AWS credentials
  s3-sink:
    build:
      context: .
      dockerfile: Dockerfile.s3-sink
    container_name: crypto-s3-sink
    profiles:
      - aws
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RAW: crypto.trades.raw
      # Pass through from host .env or set: S3_BUCKET, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
    env_file:
      - .env
    networks:
      - crypto-network
    restart: unless-stopped

  # Optional: Redshift sink — requires Redshift + S3 + IAM config
  redshift-sink:
    build:
      context: .
      dockerfile: Dockerfile.redshift-sink
    container_name: crypto-redshift-sink
    profiles:
      - aws
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RAW: crypto.trades.raw
    env_file:
      - .env
    networks:
      - crypto-network
    restart: unless-stopped

volumes:
  spark-checkpoints:

networks:
  crypto-network:
    driver: bridge
